name: vmi

services:
  vmi:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: vmi
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: "file:/app/data/vmi.db"
      FABRIC_CACHE_DIR: /app/data/cache
      BACKUP_DIR: /app/backups
      MASTER_REFRESH_ENABLED: "true"
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - vmi_data:/app/data
      - vmi_backups:/app/backups
      - vmi_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      # ต้องมี -L และ / ปิดท้าย — trailingSlash:true ทำให้ path นี้คืน 308 ไป /health/
      # curl -f exit 0 บน 308 โดยไม่ตาม redirect = healthcheck ผ่านโดยไม่เคยรัน handler
      test: ["CMD", "curl", "-fsSL", "http://localhost:3000/vmi/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  vmi_data:
  vmi_backups:
  vmi_logs:
